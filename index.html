<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ルミナ伝承</title>
<meta name="description" content="女神ルミナに えらばれた 勇者が 5つの 世界を すくう、スマホで あそべる 一人称の RPG。">
<meta name="theme-color" content="#0d0f1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ルミナ伝承">
<style>html,body{margin:0;padding:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one centered column — the first-person game screen on top, a hand-held style controller below */
:root{
  --page:#0d0f1e; --pad:#1d2138; --pad-hi:#2c3254; --pad-lo:#12152a;
  --ink:#f3f0e6; --win:#05060c; --frame:#e9e4d4; --gold:#f2c14e; --hurt:#ff9a3d; --dead:#ff5a5a; --dim:#7d829c;
  --hp:#6fd36a; --mp:#5aa8ff;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-weight:500;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:min(720px,calc((100dvh - 250px) * 1.143));min-width:min(100%,300px);margin:0 auto;display:flex;flex-direction:column;gap:10px}
@media (hover:hover) and (pointer:fine){.wrap{max-width:min(780px,calc((100dvh - 90px) * 1.143))}.topbar,.botbar{display:none!important}}
/* スマホ：画面を まん中に、上と下に かざりの 帯 */
@media not ((hover:hover) and (pointer:fine)){
  body{padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px));box-sizing:border-box;min-height:100dvh;display:flex;flex-direction:column}
  .wrap{flex:1;justify-content:space-between;max-width:min(720px,calc((100dvh - 330px) * 1.143));width:100%}
  .center{display:flex;flex-direction:column;gap:10px;margin:auto 0}
}
.topbar,.botbar{display:flex;align-items:center;gap:.6em;color:var(--dim);font-size:13px}
.topbar{justify-content:space-between;align-items:flex-start;padding:2px 2px 0}
.topbar .tl{display:flex;flex-direction:column;gap:5px;min-width:0}
.topbar .tr{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:0}
.topbar .faces{display:flex;gap:4px;min-height:0}
.topbar .faces .portrait{width:clamp(30px,9.5vw,40px);border-width:1.5px}
.topbar .faces .portrait.dead{filter:grayscale(1) brightness(.55)}
.topbar .chip.place{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cfd3ea}
.topbar .logo{font-weight:700;font-size:20px;letter-spacing:.12em;background:linear-gradient(180deg,#fff3c4,#f2c14e 55%,#b07a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #000) drop-shadow(0 0 .35em rgba(242,193,78,.35))}
.topbar .stat{display:flex;gap:.5em;align-items:center;white-space:nowrap}
.topbar .chip{background:var(--pad);border:1px solid var(--pad-hi);border-radius:999px;padding:3px 10px;color:var(--ink)}
.topbar .chip.g{color:var(--gold)}
.botbar{flex-direction:column;gap:6px;padding-bottom:2px}
.orn{width:100%;height:12px;background:
  linear-gradient(90deg,transparent,rgba(242,193,78,.55) 20%,rgba(242,193,78,.55) 80%,transparent) center/100% 1px no-repeat}
.orn::after{content:'✦';display:block;text-align:center;color:var(--gold);font-size:12px;line-height:12px;text-shadow:0 0 .5em rgba(242,193,78,.6)}
.botbar .bless{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;min-height:24px}
.botbar .bless span{font-size:12px;padding:3px 9px;border-radius:999px;background:linear-gradient(180deg,#2c3254,#1d2138);border:1px solid rgba(242,193,78,.45);color:#f5e4b0}
.botbar .bless .none{border-color:var(--pad-hi);color:var(--dim)}
.screen{position:relative;width:100%;aspect-ratio:256/224;background:#000;container-type:inline-size;overflow:hidden;border-radius:6px;box-shadow:0 0 0 3px #000,0 0 0 6px var(--pad-hi),0 10px 30px rgba(0,0,0,.6)}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#bglayer{position:absolute;inset:0;pointer-events:none;background-size:cover;background-position:center;background-color:#05061a}
#goddesslayer{position:absolute;left:50%;top:25%;height:75%;aspect-ratio:2/3;transform:translateX(-50%);background:url(assets/goddess.webp) center/contain no-repeat;pointer-events:none;animation:gfloat 5s ease-in-out infinite alternate}
#goddesslayer[hidden]{display:none}
@keyframes gfloat{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-1.5%)}}
#monlayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#monlayer .mon[data-st]::after{content:attr(data-st);position:absolute;right:0;top:0;color:#fff;font-size:1em;text-shadow:0 0 .2em #000}
#monlayer .mon{position:absolute;background-image:url(assets/monsters.webp);background-repeat:no-repeat;background-size:2600% 100%;filter:drop-shadow(0 .3em .4em rgba(0,0,0,.6))}
.speaker{position:absolute;left:50%;top:29%;height:46%;aspect-ratio:280/400;transform:translateX(-50%);background-image:url(assets/rulers.jpg);background-size:900% 100%;background-repeat:no-repeat;border:.2em solid var(--frame);border-radius:.4em;box-shadow:0 0 0 .14em #000,0 .5em 1.2em rgba(0,0,0,.6);animation:spk .35s ease-out}
.speaker.wide{aspect-ratio:768/512;height:44%;background-image:url(assets/alliance.jpg);background-size:cover;background-position:center}
.speaker .nm{position:absolute;left:50%;bottom:-.9em;transform:translateX(-50%);white-space:nowrap;background:var(--win);border:.14em solid var(--frame);border-radius:.3em;padding:0 .6em;font-size:.82em;color:var(--gold)}
@keyframes spk{from{opacity:0;transform:translateX(-50%) translateY(.6em)}to{opacity:1;transform:translateX(-50%)}}
#hud,#ui{position:absolute;inset:0;font-size:clamp(9px,3.5cqw,24px);line-height:1.5;letter-spacing:.03em}
#hud{pointer-events:none}
[hidden]{display:none!important}
.win{box-sizing:border-box;position:absolute;background:var(--win);border:.2em solid var(--frame);border-radius:.4em;box-shadow:0 0 0 .14em #000;padding:.4em .65em;color:var(--ink);overflow:hidden}
.win.msg{left:3%;right:3%;top:2.5%}
.mtext{height:6em;overflow:hidden}
.mtext .para{white-space:pre-wrap}
.arrow{position:absolute;left:50%;bottom:.1em;transform:translateX(-50%);font-size:.75em;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.wtitle{text-align:center;color:var(--gold);margin:-.1em 0 .15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;column-gap:.8em}
.item{display:flex;gap:.25em;align-items:baseline;cursor:pointer;white-space:nowrap;min-width:0}
.item .cur{width:1em;flex:none}
.item .lab{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0}
.item .rt{margin-left:auto;padding-left:.4em;font-variant-numeric:tabular-nums}
.item.dis{color:var(--dim)}
.win.inactive .cur{opacity:.55}
.more{text-align:right;font-size:.75em;line-height:1;color:var(--dim);height:.8em}
.pbar{position:absolute;left:2%;right:2%;bottom:1.8%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4%;font-size:.8em;line-height:1.25}
.pbar .win{position:relative;padding:.25em .45em .35em}
.pbar .pn{display:flex;gap:.3em;white-space:nowrap;overflow:hidden;border-bottom:.1em solid currentColor;margin-bottom:.12em}
.pbar .pn .row{color:var(--gold);flex:none}
.pbar .pn .nm{overflow:hidden;text-overflow:ellipsis}
.pbar .ln{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.pbar .bar{height:.22em;background:#1d2030;margin:.05em 0 .12em}
.pbar .bar i{display:block;height:100%;background:var(--hp)}
.pbar .bar.m i{background:var(--mp)}
.pbar .low{color:var(--hurt)} .pbar .low.win{border-color:var(--hurt)}
.pbar .dead{color:var(--dead)} .pbar .dead.win{border-color:var(--dead)}
.pbar .act{border-color:var(--gold);transform:translateY(-.4em)}
.pbar .empty{opacity:0}
.hudinfo{position:absolute;left:2.5%;top:2.5%;display:flex;flex-direction:column;gap:.15em;font-size:.85em;text-shadow:0 .1em 0 #000,0 0 .3em #000}
.hudinfo .place{background:rgba(5,6,12,.72);border:.12em solid rgba(233,228,212,.6);border-radius:.3em;padding:.1em .5em;white-space:nowrap}
.hudinfo .sub{display:flex;align-items:center;gap:.4em;background:rgba(5,6,12,.72);border-radius:.3em;padding:.1em .5em;width:max-content}
.orb{display:inline-block;width:.8em;height:.8em;border-radius:50%;box-shadow:0 0 .4em currentColor,inset 0 -.15em 0 rgba(0,0,0,.35)}
.stat{display:grid;grid-template-columns:1fr 1fr;column-gap:1em;font-size:.84em;line-height:1.36}
.stat .full{grid-column:1/-1}
.stat .kv{display:flex;justify-content:space-between;gap:.6em;font-variant-numeric:tabular-nums}
.stat .k{color:var(--gold);flex:none}
.stat .wrapv{white-space:normal;text-align:right}
.ginfo{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.info{font-size:.84em;line-height:1.38;white-space:pre-wrap}
.info .no{color:var(--dim)} .info .up{color:#8fe08a} .info .dn{color:var(--hurt)} .info .hl{color:var(--gold)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-2%,1%)}40%{transform:translate(2%,-1%)}60%{transform:translate(-1.5%,0)}80%{transform:translate(1%,1%)}}
.titlebox{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none}
.titlebox h1{margin:0;font-weight:400;font-size:2.7em;line-height:1.1;color:var(--gold);letter-spacing:.12em;text-shadow:0 .07em 0 #7a3c00,0 .14em 0 #2a1200,0 0 .5em rgba(242,193,78,.45)}
.titlebox p{margin:.35em 0 0;font-size:.9em;letter-spacing:.3em;color:#cfd6ff;text-shadow:0 .08em 0 #000}
.foot{position:absolute;left:0;right:0;bottom:3%;text-align:center;font-size:.7em;color:#9aa3cc;letter-spacing:.1em}
.namebox input{width:100%;box-sizing:border-box;background:#000;color:var(--ink);border:.12em solid var(--dim);border-radius:.3em;font:inherit;padding:.25em .4em;margin:.35em 0;outline:none;user-select:text;-webkit-user-select:text}
.namebox input:focus{border-color:var(--gold)}
.namebox button{font:inherit;background:var(--gold);color:#1a1200;border:none;border-radius:.3em;padding:.2em 1em;cursor:pointer;float:right}
.ending{position:absolute;left:0;right:0;top:12%;text-align:center}
.ending h2{margin:0;font-weight:700;font-size:2.4em;letter-spacing:.3em;color:#fff6d8;text-shadow:0 0 .4em rgba(255,200,120,.8),0 .08em 0 #7a3c00}
.ending p{margin:.4em 0 0;color:#fff;text-shadow:0 .08em 0 #000;white-space:pre-wrap}
.maptitle{position:absolute;left:0;right:0;top:1.5%;text-align:center;font-size:.85em;text-shadow:0 .1em 0 #000}
.pad{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 6px 2px;box-sizing:border-box;width:100%}
.dpad{position:relative;width:clamp(96px,min(33vw,24dvh),170px);aspect-ratio:1;flex:none;margin-left:6px;touch-action:none;cursor:pointer}
.dpad .well{position:absolute;inset:-5%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#161a32 0%,#0b0d1c 70%);box-shadow:inset 0 .25em .6em rgba(0,0,0,.75),0 1px 0 rgba(255,255,255,.07)}
.dpad .cross{position:absolute;inset:0;transition:transform .06s ease-out;filter:drop-shadow(0 4px 0 #06070f) drop-shadow(0 7px 6px rgba(0,0,0,.55))}
.dpad .shape,.dpad .shine{position:absolute;inset:0;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
.dpad .shape{background:linear-gradient(155deg,#4a5390 0%,#2e3460 42%,#1c2040 100%)}
.dpad .shine{inset:3%;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.25) 100%)}
.dpad .dimple{position:absolute;left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 50% 35%,#171a33,#2a3058);box-shadow:inset 0 .15em .3em rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.08)}
.dpad.on-up .cross{transform:perspective(420px) rotateX(12deg)}.dpad.on-down .cross{transform:perspective(420px) rotateX(-12deg)}
.dpad.on-left .cross{transform:perspective(420px) rotateY(-12deg)}.dpad.on-right .cross{transform:perspective(420px) rotateY(12deg)}
.dpad .tri{position:absolute;color:#8d93b8;font-size:clamp(10px,3.2vw,13px);line-height:1;transform:translate(-50%,-50%);text-shadow:0 1px 0 rgba(0,0,0,.7)}
.dpad.on-up .t-up,.dpad.on-down .t-down,.dpad.on-left .t-left,.dpad.on-right .t-right{color:var(--gold)}
.mid{display:flex;flex-direction:column;gap:8px;align-items:center}
.sbtn{white-space:nowrap;font:inherit;font-size:12px;letter-spacing:.06em;color:var(--ink);background:var(--pad);border:none;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:inset 0 -2px 0 var(--pad-lo)}
.ab{display:flex;gap:clamp(6px,2.5vw,12px);align-items:flex-end;flex:none}
.round{font:inherit;width:clamp(44px,min(14vw,10dvh),70px);height:clamp(44px,min(14vw,10dvh),70px);border-radius:50%;border:none;font-size:clamp(16px,5vw,20px);cursor:pointer;color:#1a1200;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 3px 0 #000;touch-action:none}
.round.a{background:var(--gold);margin-bottom:clamp(14px,5vw,22px)}
.round.b{background:#c9cde0}
.round:active,.sbtn:active{transform:translateY(2px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.keys{display:none;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--dim)}
.keys b{color:var(--ink);font-weight:500;background:var(--pad);border-radius:4px;padding:1px 6px;margin-right:4px}
@media (hover:hover) and (pointer:fine){.pad{display:none}.keys{display:flex}}
/* character creator */
.win.creator{left:2%;right:2%;top:2%;bottom:2%;display:flex;flex-direction:column;gap:.3em;font-size:.8em;line-height:1.36;padding:.35em .6em;z-index:5}
.cr-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:.1em solid var(--pad-hi);padding-bottom:.15em}
.cr-head .t{color:var(--gold)} .cr-head .lv{font-size:.88em;color:var(--dim)}
.cr-top{display:grid;grid-template-columns:minmax(0,1.1fr) 4.6em minmax(0,1fr);gap:.6em;flex:none;align-items:start}
.portrait{background-image:url(assets/portraits.jpg);background-size:2000% 1000%;background-repeat:no-repeat;background-color:#20243a;aspect-ratio:96/132;width:100%;max-width:100%;border:.12em solid var(--frame);border-radius:.3em;box-sizing:border-box;flex:none}
.stat-wrap{display:flex;gap:.7em;align-items:flex-start}.stat-wrap .stat{flex:1;min-width:0}.stat-wrap .portrait{width:24%}
.info .portrait{width:58%;margin:0 auto .3em}
.cr-ctrl{display:flex;flex-direction:column;gap:.18em;min-width:0}
.cr-row{display:flex;align-items:center;gap:.2em;cursor:pointer;white-space:nowrap;min-width:0}
.cr-row .cur{width:.9em;flex:none;font-size:.9em}
.cr-row .k{color:var(--gold);width:6.4em;flex:none;font-size:.86em;letter-spacing:0}
.cr-row .v{flex:1;display:flex;align-items:center;justify-content:space-between;min-width:0;background:var(--pad);border-radius:.25em;padding:0 .1em}
.cr-row .v b{font-weight:500;overflow:hidden;text-overflow:ellipsis;text-align:center;flex:1}
.cr-row .ar{color:var(--dim);padding:0 .35em;flex:none}
.cr-row.on .v{box-shadow:0 0 0 .1em var(--gold)} .cr-row.on .ar{color:var(--gold)}
.cr-btns{display:flex;gap:.4em;margin-top:.1em}
.cr-btn{text-align:center;border:.12em solid var(--dim);border-radius:.3em;padding:.08em .4em;cursor:pointer;white-space:nowrap}
.cr-btn.go{flex:1;background:var(--gold);color:#1a1200;border-color:var(--gold)}
.cr-btn.on{box-shadow:0 0 0 .14em #fff}
.cr-desc{font-size:.84em;line-height:1.28;color:#d8d4c8;border-left:.12em solid var(--pad-hi);padding-left:.5em;min-width:0}
.cr-desc .dk{color:var(--gold)}
.cr-body{overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8em;flex:1;min-height:0;border-top:.1em solid var(--pad-hi);padding-top:.25em}
.cr-left{display:flex;flex-direction:column;gap:.2em;min-width:0}
.cr-st{display:grid;grid-template-columns:auto 2.8em minmax(0,1fr);column-gap:.5em;align-items:center;font-variant-numeric:tabular-nums}
.cr-st .h{color:var(--dim);font-size:.82em;white-space:nowrap} .cr-st .n{text-align:right} .cr-st .k{white-space:nowrap}
.gbar{display:flex;align-items:center;gap:.3em;min-width:0}
.gbar i{display:block;height:.45em;background:var(--mp);border-radius:.1em;flex:none}
.gbar span{font-size:.82em;color:var(--dim)}
.cr-eq{font-size:.85em;color:#d8d4c8;line-height:1.3}
.cr-sk{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.cr-sk .t{color:var(--gold);font-size:.9em}
.cr-sk .s{display:flex;gap:.35em;align-items:center;white-space:nowrap;color:#b8bcd0}
.cr-sk .s.got{color:var(--ink)}
.cr-sk .lv{width:2.4em;flex:none;color:var(--dim);font-size:.9em;font-variant-numeric:tabular-nums}
.cr-sk .tag{font-size:.75em;padding:0 .25em;border-radius:.2em;background:#3a4070;flex:none;color:var(--ink)}
.cr-sk .tag.r{background:#2f6a3a}
.cr-sk .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cr-sk .mp{color:var(--mp);font-size:.9em;flex:none}
.cr-hint{text-align:center;font-size:.8em;color:var(--dim)}
.cr-eq .adv{color:var(--gold)}
.cr-desc .up{color:#8fe08a}
.cr-st.wide{grid-template-columns:auto 5.2em minmax(0,1fr)}
.cr-st .up{color:#8fe08a}
.cr-warn{color:var(--hurt);font-size:.85em}
@media (prefers-reduced-motion:reduce){#goddesslayer{animation:none}.speaker{animation:none}.shake{animation:none}.arrow{animation:none}#fade{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar" aria-label="ゲームの じょうほう"><div class="tl"><span class="logo">ルミナ伝承</span><div class="faces" id="tbFaces"></div></div><div class="tr"><span class="stat"><span class="chip" id="tbWorld" hidden></span><span class="chip g" id="tbGold" hidden>0 G</span></span><span class="chip place" id="tbPlace" hidden></span></div></div>
  <div class="center">
  <div class="screen" id="screen">
    <canvas id="cv" width="256" height="224"></canvas>
    <div id="bglayer" hidden></div>
    <div id="monlayer"></div>
    <div id="goddesslayer" hidden></div>
    <div id="hud"></div>
    <div id="ui"></div>
    <div id="flash"></div>
    <div id="fade"></div>
  </div>
  <div class="pad" aria-label="コントローラー">
    <div class="dpad" id="dpad" role="group" aria-label="方向キー">
      <div class="well"></div>
      <div class="cross"><div class="shape"></div><div class="shine"></div><div class="dimple"></div>
      <span class="tri t-up" style="left:50%;top:13%">▲</span>
      <span class="tri t-down" style="left:50%;top:87%">▼</span>
      <span class="tri t-left" style="left:13%;top:50%">◀</span>
      <span class="tri t-right" style="left:87%;top:50%">▶</span></div>
    </div>
    <div class="mid">
      <button class="sbtn" id="bMenu" type="button">メニュー</button>
      <button class="sbtn" id="bSound" type="button">音 ON</button>
    </div>

let AC=null,master=null,sfxG=null,muted=false;

function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}

const hz=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,type,vol,dest,slide){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(dest||sfxG);o.start(t);o.stop(t+d+0.03);
}
let noiseBuf=null;
function noise(t,d,vol,hp){
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*0.6,AC.sampleRate);const c=noiseBuf.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp||800;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t);s.stop(t+d+0.02);
}
function seq(t,notes,type,vol,low){return notes.reduce((tt,[m,d])=>{if(m){tone(hz(m),tt,d*0.95,type,vol);if(low)tone(hz(m-12),tt,d*0.95,'triangle',vol*1.4);}return tt+d;},t);}

function midi(n){const m=n.match(/^([A-G])(#?)(\d)$/);return 12*(+m[3]+1)+({C:0,D:2,E:4,F:5,G:7,A:9,B:11})[m[1]]+(m[2]?1:0);}
function parseSeq(s){return s.replace(/\|/g,' ').trim().split(/\s+/).map(t=>{const [n,d]=t.split(':');return [n==='R'?0:midi(n),+d];});}
function playBgm(name){bgm.want=name;if(bgm.cur===name)return;startBgm(name);}
function startBgm(name){
  stopBgm();if(!AC||!name||!TRACKS[name])return;bgm.cur=name;
  const tr=TRACKS[name],g=AC.createGain();g.gain.value=0.2;g.connect(master);bgm.gain=g;
  const unit=60/tr.bpm/2,t0=AC.currentTime+0.06;
  const voices=[{s:parseSeq(tr.lead),i:0,t:t0,type:'square',vol:0.15},{s:parseSeq(tr.bass),i:0,t:t0,type:'triangle',vol:0.34}];
  bgm.timer=setInterval(()=>{const now=AC.currentTime;for(const v of voices){if(v.t<now-0.3)v.t=now+0.05;
    while(v.t<now+0.25){const [m,d]=v.s[v.i];const dur=d*unit;if(m)tone(hz(m),v.t,Math.max(0.05,dur*0.9),v.type,v.vol,g);v.t+=dur;v.i=(v.i+1)%v.s.length;}}},60);
}
function stopBgm(){
  if(bgm.timer)clearInterval(bgm.timer);bgm.timer=null;
  if(bgm.gain){const g=bgm.gain;try{g.gain.setTargetAtTime(0,AC.currentTime,0.02);}catch(e){}setTimeout(()=>{try{g.disconnect();}catch(e){}},300);}
  bgm.gain=null;bgm.cur=null;
}

function expFor(lv){if(lv<=1)return 0;const n=lv-1;return Math.round(6*Math.pow(n,2.35)+10*n);}
const isHero=m=>!!(m&&(m.hero||m.job==='hero'||(JOBS[m.job]&&JOBS[m.job].from==='hero')));
const capOf=m=>JOBS[m.job].cap||BASE_CAP;
const wpn=m=>m.w?ITEMS[m.w]:null,arm=m=>m.a?ITEMS[m.a]:null;
const statOf=(m,k)=>m[k]+((wpn(m)||{})[k]||0)+((arm(m)||{})[k]||0);
const mpowOf=m=>statOf(m,'int'),vitOf=m=>statOf(m,'vit'),agiOf=m=>statOf(m,'agi'),dexOf=m=>statOf(m,'dex'),lukOf=m=>statOf(m,'luk');
const monDex=e=>e.dex!=null?e.dex:Math.round(e.agi*0.8+e.atk*0.15);

const BONUS_KEYS=[['int','かしこさ'],['vit','みのまもり'],['agi','すばやさ'],['dex','きようさ'],['luk','うん']];
function itemStatText(it){let t=it.slot==='w'?'こうげき +'+it.atk:'しゅび +'+it.def;BONUS_KEYS.forEach(([k,n])=>{if(it[k])t+=`　${n} ${it[k]>0?'+':''}${it[k]}`;});return t;}
function canEquip(id,m){const it=ITEMS[id];if(it.race)return m.race===it.race;if(it.only==='hero'&&!isHero(m))return false;return JOBS[m.job].eq.includes(it.type);}
function growth(m){const Rc=RACES[m.race],J=JOBS[m.job],Sx=GENDERS[m.sex||'male'],bls=G&&isHero(m)?(G.blessings||[]):[];
  return STATS.map((k,i)=>{let g=Math.max(0,Rc.g[i]+J.g[i]+Sx.g[i]+(m.fav?FAV.g[i]:0));bls.forEach(b=>{const gr=BLESSINGS[b].grow;if(gr&&gr[0]===i)g*=gr[1];});return g;});}
function learn(m){
  const got=[];const add=(lv,s)=>{if(m.lv>=+lv&&!m.skills.includes(s)){m.skills.push(s);got.push(s);}};
  Object.entries(RACES[m.race].skills).forEach(([l,s])=>add(l,s));Object.entries(JOBS[m.job].skills).forEach(([l,s])=>add(l,s));
  if(m.baseJob&&JOBS[m.baseJob])Object.entries(JOBS[m.baseJob].skills).forEach(([l,s])=>add(l,s));
  if(isHero(m)&&G)(G.blessings||[]).forEach(b=>{if(BLESSINGS[b].skill)add(1,BLESSINGS[b].skill);});
  return got;
}
function levelUp(m){
  m.lv++;const gs=growth(m),d={};
  STATS.forEach((k,i)=>{const g=gs[i];const v=g>0?Math.max(1,Math.round(g*(0.7+Math.random()*0.6))):0;d[k]=v;m[k]+=v;});
  m.hp+=d.mhp;m.mp+=d.mmp;return {d,learned:learn(m)};
}
function newMember(race,job,name,lv,sex,fav){
  sex=sex||'male';const Rc=RACES[race],J=JOBS[job],Sx=GENDERS[sex];
  const m={name,race,job,sex,lv:1,exp:0,w:J.start[0],a:J.start[1],skills:[],hero:job==='hero',fav:!!fav};
  STATS.forEach((k,i)=>m[k]=Math.max(0,Math.round(Rc.base[i]+J.base[i]+Sx.base[i]+(fav?FAV.base[i]:0))));
  m.hp=m.mhp;m.mp=m.mmp;learn(m);
  const tgt=Math.min(lv||1,J.cap);
  while(m.lv<tgt){m.exp=expFor(m.lv+1);levelUp(m);}
  m.hp=m.mhp;m.mp=m.mmp;return m;
}
function applyClassChange(m,adv){
  const J=JOBS[adv];m.baseJob=m.job;m.job=adv;
  STATS.forEach((k,i)=>m[k]+=J.base[i]);m.hp=m.mhp;m.mp=m.mmp;
  const off=[];['w','a'].forEach(sl=>{if(m[sl]&&!canEquip(m[sl],m)){addItem(m[sl]);off.push(ITEMS[m[sl]].name);m[sl]=null;}});
  return {learned:learn(m),off};
}

const jobLabel=m=>RACES[m.race].name+'・'+GENDERS[m.sex||'male'].name+'・'+JOBS[m.job].name;
// かわされる確率：守る側の すばやさ と 攻める側の きようさ を比べる
function evadeRate(defAgi,atkDex,extra){return Math.min(0.6,clamp(0.03+(defAgi-atkDex)/160,0.02,0.3)+(extra||0));}
function addItem(id,n){n=n||1;const b=G.bag.find(b=>b.id===id);if(b)b.n+=n;else G.bag.push({id,n});}

function win(cls,style){const d=document.createElement('div');d.className='win '+(cls||'');Object.assign(d.style,style||{});UI.appendChild(d);return d;}
let msgEl=null,msgBox=null;
function msgWin(){if(!msgEl){msgEl=win('msg');msgBox=document.createElement('div');msgBox.className='mtext';msgEl.appendChild(msgBox);msgEl.addEventListener('pointerdown',e=>{e.preventDefault();press('a');});}return msgEl;}
function closeMsg(){if(msgEl){msgEl.remove();msgEl=null;msgBox=null;}}
function say(text,opt){
  opt=opt||{};msgWin();if(opt.clear)msgBox.innerHTML='';
  return new Promise(res=>{
    const p=document.createElement('div');p.className='para';p.textContent=text;msgBox.appendChild(p);
    while(msgBox.scrollHeight>msgBox.clientHeight+2&&msgBox.firstChild!==p)msgBox.firstChild.remove();
    p.textContent='';
    let i=0,done=false,arrow=null,autoT=null;const step=opt.fast?3:2;
    const timer=setInterval(()=>{i=Math.min(text.length,i+step);p.textContent=text.slice(0,i);if(i>=text.length)typed();},opt.fast?16:26);
    function typed(){if(done)return;done=true;clearInterval(timer);p.textContent=text;
      if(opt.auto)autoT=setTimeout(finish,opt.auto);else if(opt.noWait)finish();
      else{arrow=document.createElement('div');arrow.className='arrow';arrow.textContent='▼';msgEl&&msgEl.appendChild(arrow);}}
    const w={onKey(k){if(k!=='a'&&k!=='b')return;if(!done)typed();else finish();}};
    function finish(){clearTimeout(autoT);if(arrow)arrow.remove();const ix=stack.indexOf(w);if(ix>=0)stack.splice(ix,1);res();}
    if(!opt.noWait)stack.push(w);
  });
}
const MID={left:'36%',top:'31%',width:'61%'};
function choose(items,opt){
  opt=opt||{};items=items.map(it=>typeof it==='string'?{label:it}:it);
  return new Promise(res=>{
    const el=win('menu',opt.style||MID);
    if(opt.title){const t=document.createElement('div');t.className='wtitle';t.textContent=opt.title;el.appendChild(t);}
    const cols=opt.cols||1,rows=opt.rows||Math.ceil(items.length/cols);
    const list=document.createElement('div');list.className='list';list.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;el.appendChild(list);
    const more=document.createElement('div');more.className='more';
    let idx=clamp(opt.index||0,0,items.length-1),top=0,closed=false;
    function render(){
      const r=Math.floor(idx/cols);if(r<top)top=r;if(r>=top+rows)top=r-rows+1;list.innerHTML='';
      for(let i=top*cols;i<Math.min(items.length,(top+rows)*cols);i++){
        const it=items[i],d=document.createElement('div');d.className='item'+(it.disabled?' dis':'');
        const c=document.createElement('span');c.className='cur';c.textContent=i===idx?'▶':'';
        const l=document.createElement('span');l.className='lab';l.textContent=it.label;d.append(c,l);
        if(it.right!=null&&it.right!==''){const rt=document.createElement('span');rt.className='rt';rt.textContent=it.right;d.appendChild(rt);}
        d.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(closed)return;audioInit();if(idx!==i){idx=i;render();}confirm();});
        list.appendChild(d);
      }
      if(Math.ceil(items.length/cols)>rows){more.textContent=(top>0?'▲':'')+((top+rows)*cols<items.length?'▼':'');if(!more.parentNode)el.appendChild(more);}
      if(opt.onMove)opt.onMove(idx);
    }
    function move(n){if(n!==idx){idx=n;sfx('cur');render();}}
    function confirm(){if(items[idx].disabled){sfx('ng');return;}sfx('ok');end(idx);}
    function end(v){closed=true;const ix=stack.indexOf(w);if(ix>=0)stack.splice(ix,1);if(opt.keep&&v>=0){el.classList.add('inactive');opt.el=el;}else el.remove();res(v);}
    const n=items.length;
    const w={onKey(k){
      if(k==='up'){let m=idx-cols;if(m<0)m=idx+cols*Math.floor((n-1-idx)/cols);move(m);}
      else if(k==='down'){let m=idx+cols;if(m>=n)m=idx%cols;move(m);}
      else if(k==='left'&&cols>1){if(idx%cols>0)move(idx-1);}
      else if(k==='right'&&cols>1){if(idx%cols<cols-1&&idx+1<n)move(idx+1);}
      else if(k==='a')confirm();
      else if(k==='b'){if(opt.cancel===false)return;sfx('cur');end(-1);}
    }};
    stack.push(w);render();
  });
}
function waitKey(){return new Promise(res=>{const w={onKey(k){if(k==='a'||k==='b'){stack.splice(stack.indexOf(w),1);sfx('cur');res();}}};stack.push(w);});}

/* =================== MAP / EXPLORE =================== */
function buildGrid(id){
  const D=DUNGEONS[id];const w=Math.max(...D.rows.map(r=>r.length));
  const g=D.rows.map(r=>r.padEnd(w,D.theme==='world'?'~':'#').split(''));
  if(id==='world'&&G.flags.bridge)lightBridge(g);
  return g;
}
function loadMap(id,x,y,dir){
  mapId=id;map=DUNGEONS[id];grid=buildGrid(id);G.loc={type:'map',map:id};G.map=id;G.x=x;G.y=y;G.dir=dir;anim=null;
  if(!G.seen[id]||G.seen[id].length!==grid.length*grid[0].length)G.seen[id]=new Array(grid.length*grid[0].length).fill(0);
  if(hasBless('star'))G.seen[id].fill(1);
  sprites=[];
  grid.forEach((row,yy)=>row.forEach((c,xx)=>{
    if(c==='X'&&map.theme!=='world'||c==='Y')sprites.push({x:xx,y:yy,type:'chest'});
    if(c==='<'||c==='>')sprites.push({x:xx,y:yy,type:'stairs',up:map.up?c==='>':c==='<'});
  }));
  Object.entries(map.foes||{}).forEach(([k,f])=>{const [fx,fy]=k.split(',').map(Number);sprites.push({x:fx,y:fy,type:'foe',foe:f});});
  markSeen();scene='explore';playBgm(map.bgm);updHud();updBar();
}
const mw=()=>grid[0].length,mh=()=>grid.length;
function cellAt(x,y){if(y<0||y>=mh()||x<0||x>=mw())return map.theme==='world'?'~':'#';return grid[y][x];}
function isWallCh(c){return map.theme==='world'?!!WORLD_WALL[c]:c==='#';}
function foeAt(x,y){const f=(map.foes||{})[x+','+y];return f&&!G.flags[f.flag]?f:null;}
function blocked(x,y){const c=cellAt(x,y);if(isWallCh(c))return true;if(map.theme==='world')return c==='~';if(c==='X'||c==='Y')return true;if(c==='E'||foeAt(x,y))return !!foeAt(x,y);return false;}
function markSeen(){const s=G.seen[mapId],w=mw();for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=G.x+dx,y=G.y+dy;if(x>=0&&y>=0&&x<w&&y<mh())s[y*w+x]=1;}}
function tryStep(back){
  const d=back?(G.dir+2)%4:G.dir,[dx,dy]=DIRV[d],nx=G.x+dx,ny=G.y+dy;
  if(blocked(nx,ny)){
    if(!back&&frontEvent())return;
    sfx('bump');return;
  }
  anim={type:'move',t:0,dur:170,fx:G.x,fy:G.y,tx:nx,ty:ny};G.x=nx;G.y=ny;sfx('step');
}
function tryTurn(s){const a0=dirAng(G.dir);G.dir=(G.dir+s+4)%4;anim={type:'turn',t:0,dur:140,a0,a1:a0+s*Math.PI/2};sfx('turn');updHud();}
function frontCell(){const [dx,dy]=DIRV[G.dir];return [G.x+dx,G.y+dy];}
function frontEvent(){
  const [x,y]=frontCell();const c=cellAt(x,y);
  if(map.theme==='world'&&GATES[c]){const g=GATES[c];if(g.town)run(()=>enterTown(g.town,true));else run(()=>goMap(g.map,g.x,g.y,g.d));return true;}
  if(map.theme==='world'&&c==='R'){run(shrineEvent);return true;}
  if(map.theme!=='world'&&(c==='X'||c==='Y')){run(()=>openChest(x,y));return true;}
  const f=foeAt(x,y);if(f){run(()=>foeEvent(f));return true;}
  return false;
}
async function goMap(id,x,y,d){sfx('stairs');await fade(1);loadMap(id,x,y,d);await fade(0);}
function onArrive(){
  markSeen();updHud();
  const k=G.x+','+G.y;
  // 階段は ふむと きいてくる（「いいえ」なら その まま とおりぬけられる）
  if(map.stairs&&map.stairs[k]){const [m,x,y,d]=map.stairs[k];const sp=sprites.find(s=>s.type==='stairs'&&s.x===G.x&&s.y===G.y);const up=sp?sp.up:true;
    run(async()=>{const c=await ask(`${DUNGEONS[m].name}へ\nかいだんを ${up?'のぼり':'おり'}ますか？`);closeMsg();if(c===0)await goMap(m,x,y,d);});return;}
  const c=cellAt(G.x,G.y);
  if(map.theme==='world'&&c==='p'){sfx('poison');flash('#8a3ab0',1,50);G.party.forEach(m=>{if(m.hp>0)m.hp=Math.max(0,m.hp-R(1,3));});updBar();if(!alive().length){run(wipeOut);return;}}
  // encounter gauge
  let mult=1;
  if(map.theme==='world')mult=({'.':1,',':0.55,':':1.1,'p':1.25}[c]||0);
  if(hasBless('star'))mult*=ENC_RATES[G.encSet||0][1];
  G.danger+=R(4,10)*mult;updHud();
  if(G.danger>=100){G.danger=0;const z=map.theme==='world'?worldZone(G.x,G.y):map.zone;run(()=>encounter(z));}
}
function worldZone(x,y){if(y>=44)return 'D';if(x>=32)return 'C';return y<18?'B':'A';}
function lightBridge(g){for(let y=42;y<48;y++)for(let x=50;x<52;x++)g[y][x]='L';}
function interact(){if(frontEvent())return;run(fieldMenuFlow);}
async function fieldMenuFlow(){await fieldMenu();if(pendingTown){const t=pendingTown;pendingTown=null;await enterTown(t,true);}}
function chestAt(key){if(key===TREASURE_CHEST&&curW().treasure)return {item:curW().treasure};return CHESTS[key];}
async function openChest(x,y){
  const key=mapId+':'+x+','+y,c=chestAt(key);
  if(!c||G.chests[key]){await say('宝箱は からっぽだ。');return;}
  G.chests[key]=1;sfx('chest');
  await say(`${G.name}は 宝箱を あけた！`);
  if(c.gold){const g=Math.round(c.gold*(hasBless('fortune')?1.5:1));G.gold+=g;await say(`${g}ゴールドを てにいれた！`);}
  else{addItem(c.item);await say(`なんと ${ITEMS[c.item].name}を みつけた！`);}

/* =================== RENDERER (raycast) =================== */
const img=ctx.createImageData(W,H),buf=new Uint32Array(img.data.buffer),zbuf=new Float32Array(W);
const FOV=0.72,LIGHT={world:7,cave:7,tower:8,castle:10};
function shade(c,b,fm,fr,fg,fb){let r=c&255,g=(c>>>8)&255,bl=(c>>>16)&255;r*=b;g*=b;bl*=b;if(fm>0){r+=(fr-r)*fm;g+=(fg-g)*fm;bl+=(fb-bl)*fm;}return (0xff000000|((bl|0)<<16)|((g|0)<<8)|(r|0))>>>0;}
function floorTex(c,wf){
  if(map.theme==='world'){if(c==='~')return wf?T.water1:T.water0;if(c==='p')return wf?T.swamp1:T.swamp0;return T[WORLD_FLOOR[c]]||T.grass;}
  if(map.theme==='castle'&&(c==='='||c==='E'))return T.carpet;return T[THEME[map.theme].floor];
}
function wallTex(c,x,y){
  if(map.theme==='world')return T[WORLD_WALL[c]]||T.forest;
  const th=THEME[map.theme];return ((x*7+y*13)%5===0)?T[th.wall2]:T[th.wall];
}
function render3D(cx,cy,ang){
  const outdoor=map.theme==='world',LR=LIGHT[map.theme],fog=THEME.world.fog,fr=fog[0],fg=fog[1],fb=fog[2];
  const dX=Math.cos(ang),dY=Math.sin(ang),pX=-dY*FOV,pY=dX*FOV;
  const wf=(frame>>5)&1,ceil=outdoor?null:T[THEME[map.theme].ceil];
  const rdx0=dX-pX,rdy0=dY-pY,rdx1=dX+pX,rdy1=dY+pY;
  for(let y=HALF+1;y<H;y++){
    const rowD=HALF/(y-HALF);
    const sx=rowD*(rdx1-rdx0)/W,sy=rowD*(rdy1-rdy0)/W;let fx=cx+rowD*rdx0,fy=cy+rowD*rdy0;
    const br=outdoor?1:clamp(1.15-rowD/LR,0,1),fm=outdoor?clamp((rowD-3)/16,0,0.92):0;
    const yo=y*W,yc=(H-1-y)*W;
    for(let x=0;x<W;x++){
      const mx=Math.floor(fx),my=Math.floor(fy),tx=((fx-mx)*TS)&(TS-1),ty=((fy-my)*TS)&(TS-1);
      const ft=floorTex(cellAt(mx,my),wf);
      buf[yo+x]=shade(ft[ty*TS+tx],br,fm,fr,fg,fb);
      if(ceil)buf[yc+x]=shade(ceil[ty*TS+tx],br*0.85,0,0,0,0);
      fx+=sx;fy+=sy;
    }
  }
  if(outdoor){
    for(let x=0;x<W;x++){const camX=2*x/W-1;let a=ang+Math.atan(camX*FOV);let u=Math.floor(((a/(Math.PI*2))%1+1)%1*512);for(let y=0;y<=HALF;y++)buf[y*W+x]=T.sky[Math.min(HALF-1,y)*512+u];}
  }
  for(let x=0;x<W;x++){
    const camX=2*x/W-1,rdx=dX+pX*camX,rdy=dY+pY*camX;
    let mx=Math.floor(cx),my=Math.floor(cy);const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);
    let stx,sty,sdx,sdy,side=0,hit=false,c='';
    if(rdx<0){stx=-1;sdx=(cx-mx)*ddx;}else{stx=1;sdx=(mx+1-cx)*ddx;}
    if(rdy<0){sty=-1;sdy=(cy-my)*ddy;}else{sty=1;sdy=(my+1-cy)*ddy;}
    for(let s=0;s<44;s++){if(sdx<sdy){sdx+=ddx;mx+=stx;side=0;}else{sdy+=ddy;my+=sty;side=1;}c=cellAt(mx,my);if(isWallCh(c)){hit=true;break;}}
    if(!hit){zbuf[x]=1e9;continue;}
    const pd=Math.max(0.05,side===0?sdx-ddx:sdy-ddy);zbuf[x]=pd;
    const lh=H/pd,ds=Math.floor(HALF-lh/2),de=Math.floor(HALF+lh/2);
    let wx=side===0?cy+pd*rdy:cx+pd*rdx;wx-=Math.floor(wx);
    let tx=Math.floor(wx*TS);if(side===0&&rdx>0)tx=TS-1-tx;if(side===1&&rdy<0)tx=TS-1-tx;
    let tex=wallTex(c,mx,my),tw=TS;
    const big=outdoor&&GT[c];
    if(big){let u=wx;if(side===0&&rdx>0)u=1-u;if(side===1&&rdy<0)u=1-u;tx=Math.min(127,Math.floor(u*128));tex=big;tw=128;}
    const br=(outdoor?1:clamp(1.15-pd/LR,0,1))*(side?0.78:1),fm=outdoor?clamp((pd-3)/16,0,0.92):0;
    const step=TS/lh;let tp=(Math.max(0,ds)-HALF+lh/2)*step;
    for(let y=Math.max(0,ds);y<=Math.min(H-1,de);y++){const ty=Math.min(TS-1,tp|0);tp+=step;const px=tex[ty*tw+tx];if(big&&(px>>>24)<128)continue;buf[y*W+x]=shade(px,br,fm,fr,fg,fb);}
  }
  // sprites
  const list=[];
  for(const s of sprites){
    if(s.type==='foe'&&G.flags[s.foe.flag])continue;
    const rx=s.x+0.5-cx,ry=s.y+0.5-cy,d2=rx*rx+ry*ry;if(d2>200)continue;list.push([s,rx,ry,d2]);
  }
  list.sort((a,b)=>b[3]-a[3]);
  const inv=1/(pX*dY-dX*pY);
  for(const [s,rx,ry] of list){
    const tX=inv*(dY*rx-dX*ry),tY=inv*(-pY*rx+pX*ry);if(tY<=0.2)continue;
    let tex,scale,ts=16;
    if(s.type==='chest'){const op=G.chests[mapId+':'+s.x+','+s.y];tex=op?sprTex('chO',CHEST_O,CHEST_PAL):sprTex('chC',CHEST_C,CHEST_PAL);scale=0.55;}
    else if(s.type==='stairs'){tex=s.up?sprTex('aU',ARCH,ARCH_UP):sprTex('aD',ARCH,ARCH_DN);scale=0.95;}
    else{const at=artTex(artKeyOf(s.foe.id),64);if(at){tex=at;ts=64;}else{const m=MON[s.foe.id];tex=sprTex('m:'+s.foe.id,SHAPES[m.shape],m.pal);}scale=1.05;}
    const full=H/tY,sh=full*scale,sw=sh,scrX=(W/2)*(1+tX/tY);
    const bob=s.type==='foe'?Math.sin(frame/12)*full*0.02:0;
    const bottom=HALF+full/2+bob,top=bottom-sh,x0=scrX-sw/2;
    const br=(outdoor?1:clamp(1.15-tY/LR,0,1)),fm=outdoor?clamp((tY-3)/16,0,0.92):0;
    for(let x=Math.max(0,Math.floor(x0));x<Math.min(W,Math.ceil(x0+sw));x++){
      if(tY>=zbuf[x])continue;const tx=Math.floor((x-x0)*ts/sw);if(tx<0||tx>=ts)continue;

async function enterTown(id,doFade){
  if(doFade!==false){sfx('door');await fade(1);}
  curTown=id;G.lastTown=id;G.loc={type:'town',id};scene='town';clearUI();playBgm('town');updHud();updBar(-1);
  await fade(0);

  const T0=TOWNS[id];let idx=0;
  while(true){
    idx=await choose(T0.menu.map(m=>m[1]),{cols:2,style:{left:'3%',top:'31%',width:'68%'},index:idx,cancel:false});
    const cmd=T0.menu[idx][0];
    if(cmd==='castle')await kingTalk();
    else if(cmd==='sage')await sageTalk();
    else if(cmd==='inn')await inn(T0.inn);
    else if(cmd==='wshop'||cmd==='ashop'){
      if(id==='selka'&&G.flags.bridge&&!G.flags.newGear){G.flags.newGear=true;await say('みせの人「光の橋の おかげで あたらしい\nしなが たくさん はいったよ！」');}
      await shop(gearList(id,cmd==='wshop'?'w':'a'),cmd==='wshop'?'武器屋':'防具屋');}
    else if(cmd==='shrine')await shrine();
    else if(cmd==='items')await shop(T0.items,'道具屋');
    else if(cmd==='church')await church();
    else if(cmd==='tavern')await tavern();
    else if(cmd==='rumor'){G.rumor=(G.rumor||0)+1;const pool=curW().rumors.concat(T0.rumors);await say('町の人「'+pool[G.rumor%pool.length]+'」');}
    else if(cmd==='party')await fieldMenu();
    else if(cmd==='exit'){closeMsg();sfx('door');await fade(1);const [x,y,d]=T0.out;loadMap('world',x,y,d);await fade(0);return;}
    closeMsg();updBar();
    if(G.flags.victory&&!G.flags.endingShown)return;
  }
}

      if(G.gold<cost){await say('神父「ゴールドが たりないようじゃ。」');continue;}
      G.gold-=cost;m.hp=m.mhp;sfx('heal');updBar();await flash('#fff',1,80);await say(`神父「おお かみよ！」\n${m.name}は いきかえった！`);

function itemInfo(id){

  let skill=null;const roll=Math.random()*100;let acc=0;
  for(const [s,p] of (e.skills||[])){acc+=p;if(roll<acc){skill=s;break;}}
  if(skill==='wave'&&!B.guard&&!B.atkUp&&!B.barrier)skill=null;
  if(!skill){
    const t=pickTarget(),tm=G.party[t];await BSC(`${e.label}の こうげき！`);
    if(Math.random()<playerEva(t,e)){sfx('miss');await BS(`${tm.name}は ひらりと みをかわした！`);return;}
    const r=phys(e.atk,pdef(t),0);
    if(r.d<=0){sfx('miss');await BS(`ミス！ ${tm.name}は ダメージを うけない！`);return;}
    await hurtMember(t,r.d,true);return;
  }
  const S=ESKILL[skill];await BSC(`${e.label}は ${S.msg}`);
  if(S.fx)B.fx={c:S.fx==='dark'?'#6a1a9a':'#ff7a1a',t:20};
  if(S.target==='dispel'){B.guard=false;B.atkUp=false;B.barrier=false;sfx('magic');await BS('なかまに かかっていた 力が きえた！');return;}
  if(S.target==='all'){if(S.fx)sfx('fire');for(const i of G.party.map((m,i)=>i).filter(i=>G.party[i].hp>0))await hurtMember(i,Math.round(R(S.pow[0],S.pow[1])*(e.spow||1)),false);return;}
  const t=pickTarget();
  if(S.mult){if(Math.random()<playerEva(t,e)){sfx('miss');await BS(`${G.party[t].name}は ひらりと みをかわした！`);return;}const r=phys(e.atk,pdef(t),0,S.mult);await hurtMember(t,Math.max(1,r.d),true);}
  else{if(S.fx)sfx('fire');await hurtMember(t,Math.round(R(S.pow[0],S.pow[1])*(e.spow||1)),false);}
}
function drawBattle(){
  ctx.drawImage(bgSnap,0,0);ctx.fillStyle='rgba(0,0,10,.5)';ctx.fillRect(0,0,W,H);
  const es=B.enemies,n=es.length,gap=6;
  const art=monArtReady;let sc=es.map(e=>(e.scale||4)*(art?1.25:1));const tot=()=>sc.reduce((s,v)=>s+v*16,0)+gap*(n-1);
  while(tot()>W-12)sc=sc.map(v=>v-0.25);
  let x=Math.round((W-tot())/2);const base=166;
  es.forEach((e,i)=>{
    const s=Math.round(sc[i]*16);
    if(e.dying){e.alpha-=0.06;if(e.alpha<=0){e.alpha=0;e.dying=false;}}
    if(e.flash>0)e.flash--;
    const vis=!(e.flash>0&&e.flash%4<2)&&(!e.dead||e.dying);
    if(vis){ctx.save();ctx.globalAlpha=e.dead?Math.max(0,e.alpha):1;const bob=e.sleep?0:Math.round(Math.sin(frame/14+i)*1.5);
      ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x+s/2,base+2,s*0.38,s*0.07,0,0,7);ctx.fill();
      if(art){if(!e.el){e.el=monArtEl(e.id);monLayer.appendChild(e.el);}const st=e.el.style;st.left=(x/W*100)+'%';st.top=((base-s+bob)/H*100)+'%';st.width=(s/W*100)+'%';st.height=(s/H*100)+'%';st.opacity=e.dead?Math.max(0,e.alpha):1;st.visibility='visible';}
      else ctx.drawImage(monCanvas(e.id),x,base-s+bob,s,s);ctx.restore();
      if((e.sleep||e.stun)&&!e.dead){if(e.el){e.el.dataset.st=e.sleep?'z':'!';}ctx.fillStyle='#fff';ctx.font='bold 9px "Zen Maru Gothic",sans-serif';ctx.fillText(e.sleep?'z':'!',x+s-6,base-s+6-(frame/10%6));}}
    else if(e.el)e.el.style.visibility='hidden';
    x+=s+gap;
  });
  if(B.fx&&B.fx.t>0){ctx.save();ctx.globalAlpha=(B.fx.t%6<3?0.4:0.18);ctx.fillStyle=B.fx.c;ctx.fillRect(0,0,W,H);ctx.restore();B.fx.t--;}
}

/* =================== TITLE / NEW GAME / ENDING =================== */
function migrateSave(g){
  if(!g.ws2){if(g.map==='world'&&g.loc&&g.loc.type==='map'){g.x=g.x*2;g.y=g.y*2;}g.ws2=1;}
  if(!g.blessings)g.blessings=g.blessing?[g.blessing]:[];delete g.blessing;g.world=g.world||1;g.worlds=g.worlds||[];
  (g.party||[]).concat(g.reserve||[]).forEach(m=>{
    if(m.job==='hero_m')m.job='hero_l';
    if(!m.sex)m.sex='male';
    if(m.fav==null)m.fav=false;
    if(m.dex==null){const i=STATS.indexOf('dex'),R0=RACES[m.race],J0=JOBS[m.baseJob||m.job]||JOBS.hero;m.dex=Math.round(R0.base[i]+J0.base[i]+(R0.g[i]+J0.g[i])*(m.lv-1));}
    (m.skills||[]).splice(0,m.skills.length,...m.skills.filter(s=>SK[s]));
  });
  const G0=G;G=g;(g.party||[]).concat(g.reserve||[]).forEach(m=>{if(m.skills)learn(m);});(g.worlds||[]).forEach(w=>(w.members||[]).forEach(m=>{if(m.skills)learn(m);}));G=G0;
}
async function titleScreen(){
  scene='title';G=null;clearUI();updBar();updHud();playBgm('title');
  const saved=loadSave();
  const c=await choose([{label:'はじめから'},{label:'つづきから',disabled:!saved}],{style:{left:'34.4%',width:'31.4%',top:'49.6%'},cancel:false,index:saved?1:0});
  if(c===1&&saved){
    G=saved;migrateSave(G);applyWorld();G.encSet=G.encSet||0;G.flags=G.flags||{};G.chests=G.chests||{};G.seen=G.seen||{};G.reserve=G.reserve||[];G.danger=G.danger||0;
    await fade(1);await enterTown(G.lastTown||'lumina',false);return;
  }
  await newGame();
}
async function newGame(){
  await fade(1);scene='goddess';clearUI();playBgm('goddess');await fade(0);
  await say('……きこえますか。\nわたしは 光の女神 ルミナ。');
  await say('この 世界には たくさんの 世界が ありますが、\nいくつかの 世界が 魔王に おびやかされています。');
  await say('あなたには 女神の使いとして\nいくつかの 世界を すくって ほしいのです。');
  await say('どの 世界でも 王が あなたを まっています。\n王の たのみを うけ、 魔王を うちたおしてください。');
  await say('ただし…… 魔王を たおした その とき、 あなたは\nその 世界を さり、 すぐに 次の 世界へ わたります。');
  await say('世界を わたるたびに 力を うしなってしまいます。');
  await say('そして あなたが さった あとの 世界は、\nその 世界に のこる なかまたちが まもらなければ なりません。');
  await say('なかまとの きずなを たいせつに……。\nいつか きっと その 力が ひつようになる はずです。');
  await say('あなたの ことを おしえてください。',{noWait:true});
  let sinfo=null;
  const sx=await choose(GENDER_KEYS.map(k=>GENDERS[k].name),{title:'あなたは？',style:{left:'3%',top:'31%',width:'30%'},cancel:false,
    onMove:i=>{if(sinfo)sinfo.remove();sinfo=infoWin(GENDERS[GENDER_KEYS[i]].desc,{left:'36%',top:'31%',right:'3%'});}});
  if(sinfo)sinfo.remove();const sex=GENDER_KEYS[sx];
  closeMsg();
  const name=await nameEntry('勇者の 名前',sex==='female'?'リア':'レイ');
  await say(`${name}…… よい 名前です。\nあなたに わたしの 力を ひとつ さずけます。`,{noWait:true});
  G={name,world:1,blessings:[],worlds:[],party:[],reserve:[],gold:200,bag:[{id:'herb',n:4},{id:'wing',n:1}],flags:{},chests:{},seen:{},lastTown:'lumina',danger:0,rumor:0,encSet:0};
  const bk=await chooseBlessing();G.blessings.push(bk);applyWorld();
  G.party.push(newMember('human','hero',name,1,sex));
  sfx('holy');await flash('#fff8d0',2,90);
  await say(`${name}は「${BLESSINGS[bk].name}」の\n力を さずかった！`,{clear:true});
  for(const l of curW().intro)await say('女神「'+l+'」');
  await say('女神「さあ、 ひとつめの 世界へ……」');
  closeMsg();await fade(1);
  await run(()=>enterTown('lumina',false));
}
async function ending(){
  G.flags.endingShown=true;scene='ending';clearUI();updBar();updHud();playBgm('title');
  const el=document.createElement('div');el.className='ending';
  const h=document.createElement('h2');h.textContent='おわり';const p=document.createElement('p');p.textContent=`5つの 世界を すくった 勇者 ${G.name}と\n世界を こえた なかまたちの 名は\n光の でんしょうとして いつまでも かたりつがれた。`;
  const p2=document.createElement('p');p2.style.fontSize='.8em';p2.textContent=G.party.map(m=>`${m.name} Lv${m.lv}`).join('　')+'\n加護: '+(G.blessings||[]).map(b=>BLESSINGS[b].name).join('・');p2.style.whiteSpace='pre-wrap';
  el.append(h,p,p2);UI.appendChild(el);await wait(1200);
  const c=await choose(['ぼうけんを つづける','タイトルへ'],{style:{left:'26%',width:'48%',top:'62%'},cancel:false});
  clearUI();
  if(c===0){save();await enterTown('lumina',false);}else titleScreen();
}

/* =================== MAIN LOOP & INPUT =================== */
let last=performance.now(),repeatT=0;
function camera(){
  let cx=G.x+0.5,cy=G.y+0.5,a=dirAng(G.dir);
  if(anim){const t=clamp(anim.t/anim.dur,0,1),e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    if(anim.type==='move'){cx=anim.fx+0.5+(anim.tx-anim.fx)*e;cy=anim.fy+0.5+(anim.ty-anim.fy)*e;}else a=anim.a0+(anim.a1-anim.a0)*e;}
  return [cx,cy,a];
}
// 町（王都）とタイトルは、絵を背景レイヤーにそのまま表示する
let bgCur=null;
let barKey='';
function syncBars(){const w=G&&G.world&&scene!=='title'?curW().title:'';const g=G&&scene!=='title'&&scene!=='goddess'?G.gold:null;
  const bl=G&&scene!=='title'?(G.blessings||[]):[];
  const pl=!G||scene==='title'||scene==='goddess'?'':scene==='town'&&curTown?TOWNS[curTown].name:(map&&map.name)||'';
  const pt=G&&scene!=='title'&&scene!=='goddess'?(G.party||[]):[];const pk=pt.map(m=>m.race+m.job+m.sex+(m.hp>0?1:0)).join(',');
  const k=w+'|'+g+'|'+bl.join(',')+'|'+pl+'|'+pk;if(k===barKey)return;barKey=k;
  const tp=document.getElementById('tbPlace'),tf=document.getElementById('tbFaces');
  if(tp){tp.textContent=pl;tp.hidden=!pl;}
  if(tf){tf.textContent='';pt.forEach(m=>{const d=portraitEl(m);if(m.hp<=0)d.classList.add('dead');d.title=m.name;tf.appendChild(d);});}
  const tw=document.getElementById('tbWorld'),tg=document.getElementById('tbGold'),tb=document.getElementById('tbBless');if(!tw)return;
  tw.textContent=w;tw.hidden=!w;tg.hidden=g==null;if(g!=null)tg.textContent=g+' G';
  tb.textContent='';if(bl.length)bl.forEach(b=>{const s=document.createElement('span');s.textContent='✦ '+BLESSINGS[b].name;tb.appendChild(s);});
  else{const s=document.createElement('span');s.className='none';s.textContent='女神の加護は まだ ありません';tb.appendChild(s);}}
function syncBg(){const L=document.getElementById('bglayer');if(!L)return;
  const want=scene==='title'?'assets/title.jpg':(scene==='town'&&curTown==='lumina'&&G)?`assets/town${G.world||1}.jpg`:(scene==='town'&&curTown==='selka')?'assets/selka.jpg':'';
  if(want!==bgCur){bgCur=want;L.style.backgroundImage=want?`url(${want})`:'';L.hidden=!want;}
  const gl=document.getElementById('goddesslayer');if(gl){const sg=scene==='goddess';if(gl.hidden===sg)gl.hidden=!sg;}}
function loop(now){syncBg();syncBars();
  const dt=Math.min(50,now-last);last=now;frame++;
  if(scene==='explore'&&map){
    if(anim){anim.t+=dt;if(anim.t>=anim.dur){const was=anim;anim=null;if(was.type==='move')onArrive();}}
    if(!anim&&!busy&&!stack.length)doDir(heldDir());
    const [cx,cy,a]=camera();render3D(cx,cy,a);drawMinimap();
  }else if(scene==='mapview'&&map)drawFullMap();
  else if(scene==='battle'&&B)drawBattle();
  else if(scene==='town')ctx.drawImage(drawTownArt(curTown),0,0);
  else if(scene==='title')drawTitle();
  else if(scene==='goddess')drawGoddess();
  else if(scene==='ending')drawEnding();
  if(stack.length&&held.touch){repeatT-=dt;if(repeatT<=0){press(held.touch);repeatT=140;}}
  requestAnimationFrame(loop);
}
const held={touch:null};let kbDirs=[];
function heldDir(){return held.touch||kbDirs[kbDirs.length-1]||null;}
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){console.error(e);}finally{closeMsg();busy=false;}}
function doDir(d){if(d==='up')tryStep(false);else if(d==='down')tryStep(true);else if(d==='left')tryTurn(-1);else if(d==='right')tryTurn(1);}
function press(k){
  audioInit();const w=stack[stack.length-1];if(w){w.onKey(k);return;}
  if(scene==='explore'&&!busy&&!anim&&G){if(k==='a')interact();else if(k==='b'||k==='menu')run(fieldMenuFlow);else doDir(k);}
}
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyZ:'a',Enter:'a',NumpadEnter:'a',Space:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyC:'menu',KeyM:'menu'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const k=KEYMAP[e.code];if(!k)return;e.preventDefault();if(['up','down','left','right'].includes(k)&&!kbDirs.includes(k))kbDirs.push(k);press(k);});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)kbDirs=kbDirs.filter(d=>d!==k);});
addEventListener('blur',()=>{kbDirs=[];held.touch=null;});
const dpad=$('#dpad');let dpadOn=false;
function dpadDir(e){const r=dpad.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);if(Math.hypot(dx,dy)<10)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function setTouch(d){if(d===held.touch)return;held.touch=d;dpad.className='dpad'+(d?' on-'+d:'');if(d&&stack.length){press(d);repeatT=360;}}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();try{dpad.setPointerCapture(e.pointerId);}catch(_){}dpadOn=true;setTouch(dpadDir(e));});
dpad.addEventListener('pointermove',e=>{if(dpadOn)setTouch(dpadDir(e));});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,()=>{dpadOn=false;setTouch(null);}));
const bind=(id,k)=>$(id).addEventListener('pointerdown',e=>{e.preventDefault();press(k);});
bind('#bA','a');bind('#bB','b');bind('#bMenu','menu');
['#bSound','#bSound2'].forEach(s=>$(s).addEventListener('click',()=>{audioInit();setMuted(!muted);}));
SCREEN.addEventListener('contextmenu',e=>e.preventDefault());

try{setMuted(localStorage.getItem('lumina-muted')==='1');}catch(e){setMuted(false);}
ctx.imageSmoothingEnabled=false;
buildTextures();loadTileArt();
requestAnimationFrame(loop);
titleScreen();
})();
